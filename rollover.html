<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Roll-Over Cost Monitor</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', system-ui, sans-serif; }
  :root {
    --bg:#0e1420; --card:#161d2b; --border:#232d42;
    --text:#e6ecf5; --muted:#7c8aa0; --accent:#e8a33d;
    --green:#2ecc71; --red:#e74c3c;
  }
  body { background:var(--bg); color:var(--text); padding:10px; min-height:100vh; }
  .wrap { max-width:520px; margin:0 auto; }
  .head { display:flex; justify-content:space-between; align-items:center; padding:2px 4px 8px; flex-wrap:wrap; gap:6px; }
  .head h1 { font-size:0.92rem; font-weight:700; display:flex; align-items:center; gap:6px; }
  .head h1 i { color:var(--accent); }
  .head .meta { color:var(--muted); font-size:0.62rem; display:flex; gap:8px; flex-wrap:wrap; }
  .head .meta strong { color:var(--text); font-weight:600; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:8px; margin-bottom:8px; }
  .card h3 {
    font-size:0.66rem; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--accent); display:flex; justify-content:space-between; align-items:center;
    margin-bottom:6px; padding-bottom:5px; border-bottom:1px solid var(--border);
  }
  .card h3 i { color:var(--accent); margin-right:5px; }
  .save-hint { font-size:0.55rem; color:var(--accent); margin-left:6px; opacity:0; transition:opacity 0.3s; text-transform:none; letter-spacing:0; font-weight:600; }
  .save-hint.show { opacity:1; }

  .roll-table { width:100%; border-collapse:collapse; font-size:0.7rem; table-layout:fixed; }
  .roll-table col.c1 { width:9%; }
  .roll-table col.c2 { width:26%; }
  .roll-table col.c3 { width:21%; }
  .roll-table col.c4 { width:24%; }
  .roll-table col.c5 { width:20%; }

  .roll-table th {
    text-align:center; color:var(--muted); font-weight:600;
    padding:5px 3px; border:1px solid var(--border);
    font-size:0.58rem; text-transform:uppercase; letter-spacing:0.4px;
    background:#0e1724;
  }
  .roll-table th.section-h {
    background:#1a2334; color:var(--accent); text-align:left;
    font-size:0.62rem; letter-spacing:0.5px; padding:4px 6px; font-weight:600;
  }
  .roll-table th.metal-h { text-align:left; }

  .roll-table td {
    padding:5px 3px; border:1px solid var(--border);
    text-align:center; color:#c6d0de;
    font-variant-numeric:tabular-nums; font-weight:600; font-size:0.7rem;
  }
  .roll-table td.metal-name {
    text-align:left; font-weight:700; font-size:0.72rem; padding:5px 6px;
  }

  .roll-table td.pos { color:var(--green); }
  .roll-table td.neg { color:var(--red); }
  .roll-table td.muted { color:var(--muted); font-weight:400; }

  .roll-table input.avg-input,
  .roll-table input.roll-input {
    width:100%; background:#0e1724; border:1px solid var(--border); color:#fff;
    padding:3px 4px; border-radius:4px; font-size:0.68rem; font-weight:600;
    font-variant-numeric:tabular-nums; text-align:center; font-family:inherit;
  }
  .roll-table input.avg-input:focus,
  .roll-table input.roll-input:focus { outline:none; border-color:var(--accent); background:rgba(232,163,61,0.05); }

  .roll-table input.avg-input.edited,
  .roll-table input.roll-input.edited { border-color:var(--border); background:#0e1724; }

  .roll-table input.avg-input::placeholder,
  .roll-table input.roll-input::placeholder { color:var(--muted); }

  .roll-table input.roll-input.pos { color:var(--green); }
  .roll-table input.roll-input.neg { color:var(--red); }

  .status { padding:4px 7px; border-radius:5px; margin-bottom:6px; font-size:0.58rem; }
  .status.ok   { background:rgba(46,204,113,0.12); border:1px solid var(--green); color:#7ee8a7; }
  .status.err  { background:rgba(231,76,60,0.12);  border:1px solid var(--red);   color:#f5a3a3; }
  .status.info { background:rgba(232,163,61,0.10); border:1px solid var(--accent); color:var(--accent); }
  .toolbar { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:6px; }
  .btn { background:#0e1724; border:1px solid var(--border); color:var(--muted); padding:3px 7px; border-radius:4px; font-size:0.58rem; font-weight:500; cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:3px; }
  .btn:hover { color:var(--text); border-color:#33425e; }
  .freq-group { display:inline-flex; background:#0e1724; border:1px solid var(--border); border-radius:4px; overflow:hidden; }
  .freq-group button { background:transparent; border:none; color:var(--muted); padding:2px 6px; font-size:0.54rem; font-weight:600; cursor:pointer; font-family:inherit; }
  .freq-group button.active { background:var(--accent); color:#0e1420; }
  .chart-wrap { position:relative; width:100%; height:130px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1><i class="fas fa-exchange-alt"></i> Roll-Over Cost Monitor</h1>
    <div class="meta" id="headMeta"></div>
  </div>
  <div id="status" class="status info"><i class="fas fa-spinner fa-spin"></i> Loading…</div>
  <div class="toolbar">
    <button class="btn" id="reloadBtn"><i class="fas fa-sync-alt"></i> Reload</button>
    <button class="btn" id="resetEditsBtn"><i class="fas fa-undo"></i> Reset Edits</button>
  </div>
  <div class="card">
    <h3>
      <span><i class="fas fa-balance-scale"></i> Roll-Over Summary <span id="saveHint" class="save-hint">Saved ✓</span></span>
      <span id="snapshotDate" style="font-size:0.55rem;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0;"></span>
    </h3>
    <table class="roll-table">
      <colgroup>
        <col class="c1"><col class="c2"><col class="c3"><col class="c4"><col class="c5">
      </colgroup>
      <thead>
        <tr><th class="section-h" colspan="5">LME</th></tr>
        <tr>
          <th class="metal-h">METAL</th>
          <th>AVG BUY</th>
          <th>LME 3M</th>
          <th>1M ROLL</th>
          <th>STOCK</th>
        </tr>
      </thead>
      <tbody id="lmeBody"><tr><td colspan="5" class="muted" style="text-align:center;">Loading…</td></tr></tbody>
      <thead>
        <tr><th class="section-h" colspan="5">MCX</th></tr>
        <tr>
          <th class="metal-h">METAL</th>
          <th>AVG BUY</th>
          <th>FRONT</th>
          <th>NEXT</th>
          <th>1M ROLL</th>
        </tr>
      </thead>
      <tbody id="mcxBody"><tr><td colspan="5" class="muted" style="text-align:center;">Loading…</td></tr></tbody>
    </table>
  </div>

  <div class="card">
    <h3>
      <span><i class="fas fa-chart-line"></i> MCX Zinc (₹/kg)</span>
      <span class="freq-group" id="zincRangeGroup">
        <button data-range="7d">1W</button>
        <button data-range="1m" class="active">1M</button>
        <button data-range="3m">3M</button>
        <button data-range="1y">1Y</button>
        <button data-range="all">All</button>
      </span>
    </h3>
    <div class="chart-wrap"><canvas id="zincChart"></canvas></div>
    <div id="zincNote" style="font-size:0.55rem;color:var(--muted);margin-top:4px;"></div>
  </div>
</div>

<script>
const CSP_URL = 'https://raw.githubusercontent.com/aditya1312ff-pixel/Metal-Dashboard/main/lme_csp.csv';
const METALS_URL = 'https://raw.githubusercontent.com/aditya1312ff-pixel/Metal-Dashboard/main/metals.csv';
const LIVE_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vROr3cjVUMAqL9qXYAp6rxcekcbiacZmQ4JfSMOjgoEKKAxhLLDCsMddPf6G3ZgnN0b4dWl7RrghaZ9/pub?gid=0&single=true&output=csv';
const LIVE_PROXY = 'https://round-cake-56f6.aditya1312ff.workers.dev/?url=';
const CSP_COLORS = { Cu:'#d68b4d', Zn:'#5b8fc9', Al:'#93a2b5' };
const AVG_EDITS_KEY = 'rollover_avg_edits_v1';
const ROLL_EDITS_KEY = 'rollover_roll_edits_v1';
const ZINC_HISTORY_KEY = 'rollover_mcx_zinc_history_v1';

const DEFAULT_AVG_BUYING = {
  LME_Al: 2764.8,
  LME_Cu: 8360,
  LME_Zn: 2724.98,
  MCX_Al: 0,
  MCX_Cu: 0,
  MCX_Zn: 282.8,
};

let CSP_RAW = [];
let METALS_RAW = [];
let METALS_COLS = [];
let MCX_ZINC_COL = null;
let ZINC_HISTORY = [];
let LATEST_CSP = null;
let LIVE_NOW = null;
let LIVE_LATEST = {};     // ← NEW: full live symbol map
let AVG_EDITS = {};
let ROLL_EDITS = {};
let zincChart = null;
let zincRange = '1m';

const STORE = (() => {
  const mem = {};
  let ok = false;
  try { localStorage.setItem('__rt','1'); localStorage.removeItem('__rt'); ok = true; } catch(e) {}
  return {
    getItem: k => ok ? localStorage.getItem(k) : (mem[k] ?? null),
    setItem: (k,v) => { if (ok) try { localStorage.setItem(k,v); } catch(e) { mem[k]=v; } else mem[k]=v; },
    removeItem: k => { if (ok) try { localStorage.removeItem(k); } catch(e) { delete mem[k]; } else delete mem[k]; },
  };
})();
function loadEdits() { try { const r = STORE.getItem(AVG_EDITS_KEY); return r ? JSON.parse(r) : {}; } catch(e) { return {}; } }
function saveEdits() { try { STORE.setItem(AVG_EDITS_KEY, JSON.stringify(AVG_EDITS)); } catch(e) {} }
function loadRollEdits() { try { const r = STORE.getItem(ROLL_EDITS_KEY); return r ? JSON.parse(r) : {}; } catch(e) { return {}; } }
function saveRollEdits() { try { STORE.setItem(ROLL_EDITS_KEY, JSON.stringify(ROLL_EDITS)); } catch(e) {} }
function loadZincHistory() { try { const r = STORE.getItem(ZINC_HISTORY_KEY); return r ? JSON.parse(r) : []; } catch(e) { return []; } }
function saveZincHistory() { try { STORE.setItem(ZINC_HISTORY_KEY, JSON.stringify(ZINC_HISTORY)); } catch(e) {} }

function parseCSVLine(line) {
  const delim = line.indexOf('\t') >= 0 ? '\t' : ',';
  const out = []; let cur = ''; let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { if (inQuotes && line[i+1] === '"') { cur += '"'; i++; } else inQuotes = !inQuotes; }
    else if (ch === delim && !inQuotes) { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out.map(s => s.trim());
}
function parseNumber(s) {
  if (s == null) return null;
  s = String(s).replace(/,/g, '').replace(/[^\d.\-eE]/g, '');
  if (s === '') return null;
  const v = parseFloat(s);
  return isFinite(v) ? v : null;
}
const MONTH_NAMES = { january:0,february:1,march:2,april:3,may:4,june:5,july:6,august:7,september:8,october:9,november:10,december:11,jan:0,feb:1,mar:2,apr:3,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11 };
function parseDateLoose(s) {
  s = String(s).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
  if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})\.?\s+([A-Za-z]+)\s+(\d{4})$/);
  if (m) {
    const day = m[1].padStart(2, '0');
    const monIdx = MONTH_NAMES[m[2].toLowerCase()];
    if (monIdx !== undefined) return `${m[3]}-${String(monIdx+1).padStart(2,'0')}-${day}`;
  }
  return null;
}
function fmt2(v) { return v == null ? '—' : v.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmt0(v) { return v == null ? '—' : Math.round(v).toLocaleString(); }

function parseCSPCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
  if (!lines.length) return { ok:false, msg:'empty' };
  const header = parseCSVLine(lines[0]).map(h => h.replace(/^"|"$/g, '').trim());
  let dateCol = header.findIndex(h => /date|time|day|timestamp/i.test(h));
  if (dateCol < 0) dateCol = 0;
  const map = {};
  header.forEach((name, idx) => {
    if (idx === dateCol) return;
    const n = name.toLowerCase();
    let metal = null;
    if (/\b(copper|cu)\b/.test(n)) metal = 'Cu';
    else if (/\b(zinc|zn)\b/.test(n)) metal = 'Zn';
    else if (/\b(aluminium|aluminum|alu|al)\b/.test(n)) metal = 'Al';
    if (!metal) return;
    let field = null;
    if (/cash|spot/.test(n)) field = 'cash';
    else if (/(3[\s-]?m(onth)?|three[\s-]?month)/.test(n)) field = 'three';
    else if (/stock|invent|warehouse|lme.?stock/.test(n)) field = 'stock';
    if (!field) return;
    if (!map[metal]) map[metal] = {};
    map[metal][field] = idx;
  });
  if (!Object.keys(map).length) return { ok:false, msg:'no cols' };
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const parts = parseCSVLine(lines[i]);
    if (parts.length <= dateCol) continue;
    const d = parseDateLoose(parts[dateCol]);
    if (!d) continue;
    const t = new Date(d + 'T00:00:00Z').getTime();
    const entry = { date: d, t };
    for (const [metal, idx] of Object.entries(map)) {
      const get = (i) => (i != null && parts[i] != null) ? parseNumber(parts[i]) : null;
      entry[metal] = { cash: get(idx.cash), threeM: get(idx.three), stock: get(idx.stock) };
    }
    rows.push(entry);
  }
  rows.sort((a,b) => a.t - b.t);
  CSP_RAW = rows;
  LATEST_CSP = rows.length ? rows[rows.length-1] : null;
  return { ok: true, msg: `CSP ${rows.length}` };
}

function parseMetalsCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
  if (!lines.length) return { ok:false, msg:'empty' };
  const header = parseCSVLine(lines[0]).map(h => h.replace(/^"|"$/g, '').trim());
  if (header.length < 2) return { ok:false, msg:'needs 2 cols' };
  METALS_COLS = header.slice(1);

  MCX_ZINC_COL = null;
  for (const name of METALS_COLS) {
    const n = name.toLowerCase();
    if (/\bmcx\b/.test(n) && /\bzinc|zn\b/.test(n)) { MCX_ZINC_COL = name; break; }
  }
  if (!MCX_ZINC_COL) {
    for (const name of METALS_COLS) {
      const n = name.toLowerCase();
      if (/zinc/.test(n) && /mcx/.test(n)) { MCX_ZINC_COL = name; break; }
    }
  }

  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const parts = parseCSVLine(lines[i]);
    if (parts.length < 2) continue;
    const d = parseDateLoose(parts[0]);
    if (!d) continue;
    const t = new Date(d + 'T00:00:00Z').getTime();
    const series = {};
    for (let j = 0; j < METALS_COLS.length; j++) {
      const v = parseNumber(parts[j + 1]);
      if (v != null) series[METALS_COLS[j]] = v;
    }
    rows.push({ date: d, t, series });
  }
  rows.sort((a,b) => a.t - b.t);
  METALS_RAW = rows;
  return { ok: true, msg: `metals ${rows.length}` };
}

function parseLiveCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
  if (lines.length < 2) return [];
  const header = parseCSVLine(lines[0]).map(h => h.toLowerCase());
  const idxSym = header.findIndex(h => /symbol|ticker/.test(h));
  const idxPr  = header.findIndex(h => /price|close|value/.test(h));
  if (idxSym < 0 || idxPr < 0) return [];
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const parts = parseCSVLine(lines[i]);
    if (parts.length <= Math.max(idxSym, idxPr)) continue;
    const symbol = parts[idxSym].trim().toUpperCase();
    const price = parseNumber(parts[idxPr]);
    if (!symbol || price == null) continue;
    rows.push({ symbol, price });
  }
  return rows;
}

async function fetchLive() {
  try {
    const bustedUrl = LIVE_URL + (LIVE_URL.includes('?') ? '&' : '?') + '_cb=' + Date.now();
    const res = await fetch(LIVE_PROXY + encodeURIComponent(bustedUrl), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const txt = await res.text();
    const rows = parseLiveCSV(txt);
    if (!rows.length) throw new Error('Empty parse');
    const bySym = {};
    for (const r of rows) bySym[r.symbol] = r;
    LIVE_LATEST = bySym;    // ← save globally
    const pick = (a, b) => ({ front: bySym[a]?.price ?? null, next: bySym[b]?.price ?? null });
    const zinc      = pick('ZINC1!',      'ZINC2!');
    const copper    = pick('COPPER1!',    'COPPER2!');
    const aluminium = pick('ALUMINIUM1!', 'ALUMINIUM2!');
    LIVE_NOW = {
      date: new Date().toISOString().slice(0,10),
      zinc1: zinc.front, zinc2: zinc.next,
      cu1: copper.front, cu2: copper.next,
      al1: aluminium.front, al2: aluminium.next,
      fetchedAt: new Date().toISOString(),
    };
    return { ok: true };
  } catch (e) { return { ok: false, error: e.message }; }
}

async function loadAll() {
  const status = document.getElementById('status');
  status.className = 'status info';
  status.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading…';

  const [cspRes, metalsRes, liveRes] = await Promise.all([
    (async () => {
      try {
        const r = await fetch(CSP_URL + '?_cb=' + Date.now(), { cache: 'no-store', redirect: 'follow' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return parseCSPCSV(await r.text());
      } catch (e) { return { ok:false, msg:'CSP: ' + e.message }; }
    })(),
    (async () => {
      try {
        const r = await fetch(METALS_URL + '?_cb=' + Date.now(), { cache: 'no-store', redirect: 'follow' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return parseMetalsCSV(await r.text());
      } catch (e) { return { ok:false, msg:'metals: ' + e.message }; }
    })(),
    fetchLive(),
  ]);

  const msgs = [];
  if (cspRes.ok) msgs.push('✓ ' + cspRes.msg); else msgs.push('✗ ' + cspRes.msg);
  if (metalsRes.ok) msgs.push('✓ ' + metalsRes.msg); else msgs.push('✗ ' + metalsRes.msg);
  if (liveRes.ok && LIVE_NOW) msgs.push('✓ Live');
  else msgs.push('✗ Live: ' + (liveRes.error || 'unknown'));

  status.className = (cspRes.ok && liveRes.ok) ? 'status ok' : 'status err';
  status.innerHTML = msgs.join(' · ');

  captureTodayZinc();
  render();
  renderZincChart();
}

function captureTodayZinc() {
  if (!LIVE_NOW || LIVE_NOW.zinc1 == null) return;
  const today = LIVE_NOW.date;
  ZINC_HISTORY = ZINC_HISTORY.filter(x => x.date !== today);
  ZINC_HISTORY.push({ date: today, t: new Date(today + 'T00:00:00Z').getTime(), v: LIVE_NOW.zinc1 });
  ZINC_HISTORY.sort((a,b) => a.t - b.t);
  saveZincHistory();
}

/* Resolve LME 3M — prefer live symbols COPPER/ZINC/ALUMINIUM, fallback to CSP CSV */
function lme3MSource(metal) {
  const liveSym = metal === 'Cu' ? 'COPPER' : metal === 'Zn' ? 'ZINC' : 'ALUMINIUM';
  if (LIVE_LATEST[liveSym] && LIVE_LATEST[liveSym].price != null) {
    return LIVE_LATEST[liveSym].price;
  }
  if (LATEST_CSP && LATEST_CSP[metal] && LATEST_CSP[metal].threeM != null) {
    return LATEST_CSP[metal].threeM;
  }
  return null;
}

/* LME: 3M comes from live COPPER / ZINC / ALUMINIUM */
function lmeDefaults(metal) {
  if (!LATEST_CSP || !LATEST_CSP[metal]) return { avgBuy: null, current: null, roll: null, stock: null };
  const row = LATEST_CSP[metal];
  const lme3m = lme3MSource(metal);
  return { avgBuy: lme3m, current: lme3m, roll: null, stock: row.stock };
}

function mcxDefaults(metal) {
  let front = null, next = null;
  if (LIVE_NOW) {
    if (metal === 'Zn') { front = LIVE_NOW.zinc1; next = LIVE_NOW.zinc2; }
    else if (metal === 'Cu') { front = LIVE_NOW.cu1; next = LIVE_NOW.cu2; }
    else if (metal === 'Al') { front = LIVE_NOW.al1; next = LIVE_NOW.al2; }
  }
  return { avgBuy: next, current: front, next: next, roll: (front != null && next != null) ? next - front : null };
}

function rollInputHtml(editKey, value) {
  const isEdited = ROLL_EDITS[editKey] !== undefined && ROLL_EDITS[editKey] !== null;
  const v = isEdited ? ROLL_EDITS[editKey] : value;
  const cls = v == null ? '' : (v > 0 ? 'pos' : v < 0 ? 'neg' : '');
  const sign = v == null ? '' : (v >= 0 ? '+' : '');
  const display = v == null ? '' : (sign + v.toFixed(2));
  return `<input type="number" step="0.01" class="roll-input ${cls}" data-roll-key="${editKey}" value="${display}" placeholder="—">`;
}

function render() {
  const lmeBody = document.getElementById('lmeBody');
  const mcxBody = document.getElementById('mcxBody');
  const snapEl  = document.getElementById('snapshotDate');
  const headEl  = document.getElementById('headMeta');

  if (!LATEST_CSP) {
    lmeBody.innerHTML = '<tr><td colspan="5" class="muted" style="text-align:center;">No CSP.</td></tr>';
    mcxBody.innerHTML = '<tr><td colspan="5" class="muted" style="text-align:center;">No CSP.</td></tr>';
    return;
  }
  snapEl.textContent = LATEST_CSP.date;
  headEl.innerHTML = `Live: <strong>${LIVE_NOW ? new Date(LIVE_NOW.fetchedAt).toLocaleTimeString() : '—'}</strong>`;

  const metals = [
    { key:'Al', name:'Al', color: CSP_COLORS.Al },
    { key:'Cu', name:'Cu', color: CSP_COLORS.Cu },
    { key:'Zn', name:'Zn', color: CSP_COLORS.Zn },
  ];

  let lmeHtml = '';
  for (const m of metals) {
    const d = lmeDefaults(m.key);
    const avgKey = 'LME_' + m.key;
    const rollKey = 'ROLL_LME_' + m.key;
    const isAvgEdited = AVG_EDITS[avgKey] !== undefined && AVG_EDITS[avgKey] !== null;
    const defaultAvg = DEFAULT_AVG_BUYING[avgKey] ?? d.avgBuy;
    const avgValue = isAvgEdited ? AVG_EDITS[avgKey] : defaultAvg;
    lmeHtml += `<tr>
      <td class="metal-name" style="color:${m.color}">${m.name}</td>
      <td><input type="number" step="0.01" class="avg-input" data-key="${avgKey}" value="${avgValue != null ? avgValue : ''}" placeholder="—"></td>
      <td>${fmt2(d.current)}</td>
      <td>${rollInputHtml(rollKey, d.roll)}</td>
      <td>${fmt0(d.stock)}</td>
    </tr>`;
  }
  lmeBody.innerHTML = lmeHtml;

  let mcxHtml = '';
  for (const m of metals) {
    const d = mcxDefaults(m.key);
    const avgKey = 'MCX_' + m.key;
    const isAvgEdited = AVG_EDITS[avgKey] !== undefined && AVG_EDITS[avgKey] !== null;
    const defaultAvg = DEFAULT_AVG_BUYING[avgKey] ?? d.avgBuy;
    const avgValue = isAvgEdited ? AVG_EDITS[avgKey] : defaultAvg;
    const rollCls = d.roll == null ? 'muted' : (d.roll > 0 ? 'pos' : d.roll < 0 ? 'neg' : 'muted');
    const rollSign = d.roll == null ? '' : (d.roll >= 0 ? '+' : '');
    mcxHtml += `<tr>
      <td class="metal-name" style="color:${m.color}">${m.name}</td>
      <td><input type="number" step="0.01" class="avg-input" data-key="${avgKey}" value="${avgValue != null ? avgValue : ''}" placeholder="—"></td>
      <td>${fmt2(d.current)}</td>
      <td>${fmt2(d.next)}</td>
      <td class="${rollCls}">${d.roll == null ? '—' : rollSign + fmt2(d.roll)}</td>
    </tr>`;
  }
  mcxBody.innerHTML = mcxHtml;

  document.querySelectorAll('.avg-input').forEach(inp => {
    inp.addEventListener('input', () => {
      const key = inp.dataset.key;
      const val = inp.value === '' ? null : parseFloat(inp.value);
      if (val == null || isNaN(val)) { delete AVG_EDITS[key]; }
      else { AVG_EDITS[key] = val; }
      saveEdits();
      showSaveHint();
    });
  });

  document.querySelectorAll('.roll-input').forEach(inp => {
    inp.addEventListener('input', () => {
      const key = inp.dataset.rollKey;
      const raw = inp.value.replace(/^\+/, '');
      const val = raw === '' ? null : parseFloat(raw);
      if (val == null || isNaN(val)) {
        delete ROLL_EDITS[key];
        inp.classList.remove('pos', 'neg');
      } else {
        ROLL_EDITS[key] = val;
        inp.classList.toggle('pos', val > 0);
        inp.classList.toggle('neg', val < 0);
      }
      saveRollEdits();
      showSaveHint();
    });
  });
}

function zincCutoff(range) {
  const now = Date.now();
  const D = 24 * 3600 * 1000;
  switch (range) {
    case '7d': return now - 7 * D;
    case '1m': return now - 30 * D;
    case '3m': return now - 90 * D;
    case '1y': return now - 365 * D;
    default:   return null;
  }
}

function buildZincSeries() {
  const merged = new Map();
  if (MCX_ZINC_COL && METALS_RAW.length) {
    for (const r of METALS_RAW) {
      const v = r.series[MCX_ZINC_COL];
      if (v != null) merged.set(r.date, { date: r.date, t: r.t, v });
    }
  }
  for (const r of ZINC_HISTORY) if (!merged.has(r.date)) merged.set(r.date, r);
  if (LIVE_NOW && LIVE_NOW.zinc1 != null) {
    merged.set(LIVE_NOW.date, { date: LIVE_NOW.date, t: new Date(LIVE_NOW.date + 'T00:00:00Z').getTime(), v: LIVE_NOW.zinc1 });
  }
  return [...merged.values()].sort((a,b) => a.t - b.t);
}

function renderZincChart() {
  const canvas = document.getElementById('zincChart');
  const noteEl = document.getElementById('zincNote');
  if (!canvas) return;

  const all = buildZincSeries();
  const cutoff = zincCutoff(zincRange);
  const rows = cutoff ? all.filter(r => r.t >= cutoff) : all;
  const data = rows.map(r => ({ x: r.t, y: r.v }));

  if (noteEl) noteEl.textContent = MCX_ZINC_COL ? `${rows.length} pts` : `⚠️ no MCX Zn col · ${rows.length} pts`;

  if (zincChart) zincChart.destroy();
  zincChart = new Chart(canvas, {
    type: 'line',
    data: {
      datasets: [{
        label: 'MCX Zn',
        data,
        borderColor: '#5b8fc9',
        backgroundColor: 'rgba(91,143,201,0.15)',
        borderWidth: 1.6,
        pointRadius: 0,
        pointHoverRadius: 3,
        tension: 0.15,
        fill: true,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(14,20,32,0.95)',
          borderColor: '#232d42',
          borderWidth: 1,
          titleColor: '#e8a33d',
          bodyColor: '#e6ecf5',
          padding: 5,
          titleFont: { size: 9 },
          bodyFont: { size: 10 },
          callbacks: {
            label: ctx => {
              const v = ctx.parsed.y;
              return v == null ? '—' : `₹${v.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})}/kg`;
            }
          }
        }
      },
      scales: {
        x: {
          type: 'time',
          time: { tooltipFormat: 'dd MMM yyyy' },
          grid: { color: '#1c2536' },
          ticks: { color: '#7c8aa0', font: { size: 7 }, maxTicksLimit: 5 }
        },
        y: {
          grid: { color: '#1c2536' },
          ticks: { color: '#7c8aa0', font: { size: 7 }, callback: v => '₹' + v, maxTicksLimit: 4 }
        }
      }
    }
  });
}

document.getElementById('reloadBtn').addEventListener('click', loadAll);
document.getElementById('resetEditsBtn').addEventListener('click', () => {
  if (!confirm('Reset all edits?')) return;
  AVG_EDITS = {};
  ROLL_EDITS = {};
  STORE.removeItem(AVG_EDITS_KEY);
  STORE.removeItem(ROLL_EDITS_KEY);
  render();
});

document.querySelectorAll('#zincRangeGroup button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#zincRangeGroup button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  zincRange = b.dataset.range;
  renderZincChart();
}));

let saveHintTimer = null;
function showSaveHint() {
  const el = document.getElementById('saveHint');
  if (!el) return;
  el.classList.add('show');
  clearTimeout(saveHintTimer);
  saveHintTimer = setTimeout(() => el.classList.remove('show'), 1500);
}

AVG_EDITS = loadEdits();
ROLL_EDITS = loadRollEdits();
ZINC_HISTORY = loadZincHistory();
loadAll();
setInterval(loadAll, 60000);
</script>
</body>
</html>
